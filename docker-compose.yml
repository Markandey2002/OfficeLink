services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: office-link-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-office-link.json:/opt/keycloak/data/import/realm-office-link.json:ro
