services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: office-link-postgres
    environment:
      POSTGRES_DB: office_link
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d office_link"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak (optional OIDC provider) ──────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: office-link-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-office-link.json:/opt/keycloak/data/import/realm-office-link.json:ro

  # ── Spring Boot backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: office-link-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/office_link
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-OfficeLinkDevSecretKeyMustBeAtLeast32BytesLong!!}
      JWT_ISSUER: ${JWT_ISSUER:-office-link-local}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Set OIDC_ENABLED=true to enable Keycloak OIDC alongside the local JWT issuer.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://keycloak:8081/realms/office-link}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-office-link-api}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-office-link-frontend}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/auth/oidc-config || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  postgres_data:
